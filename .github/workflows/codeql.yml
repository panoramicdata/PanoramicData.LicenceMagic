name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning walks history to compute the version height, so autobuild
          # fails outright on the default shallow clone. CI does the same for the same reason.
          fetch-depth: 0
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
